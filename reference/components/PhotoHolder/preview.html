<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Photo Holder — preview</title></head>
<body>
<div class="pa-panel" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;padding:36px 32px 28px;align-items:end"><figure style="margin:0"><div class="pa-corners" style="box-shadow:var(--shadow-print)"><span class="pa-photo ph-1"></span><i></i><i></i><i></i><i></i></div><figcaption class="pa-caption" style="margin-top:20px">Corners</figcaption></figure><figure style="margin:0"><div class="pa-corners slit pa-print" style="padding:10px"><span class="pa-photo ph-2"></span><i></i><i></i><i></i><i></i></div><figcaption class="pa-caption" style="margin-top:20px">Corner slits</figcaption></figure><figure style="margin:0"><div class="pa-pocket"><div class="pa-print" style="padding:10px;transform:rotate(-2deg)"><span class="pa-photo ph-3"></span></div><div class="sleeve"><svg viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18 L0 9 C 50 1 100 14 150 8 C 200 2 250 13 300 6 L300 18 Z"></path></svg></div></div><figcaption class="pa-caption" style="margin-top:32px">Pocket</figcaption></figure><figure style="margin:0"><div class="pa-print" style="transform:rotate(2.5deg)"><span class="pa-photo ph-4"></span><span class="pa-tape" aria-hidden="true"></span><span class="cap">[Caption]</span></div><figcaption class="pa-caption" style="margin-top:20px">Tape</figcaption></figure></div>
</body>
</html>
