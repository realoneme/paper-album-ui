<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Album UI</title>
<style>
  html, body { margin: 0; height: 100%; padding: 0; }
  body { background: var(--background); color: var(--foreground); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .glow { fill: var(--glow); opacity: .28; }
  .moon { fill: var(--print); }
  .cloud { fill: var(--card); }
  .far { fill: var(--muted); }
  .mid { fill: var(--border); }
  .wood { fill: var(--wood); }
  .deep { fill: var(--primary); }
  .edge { fill: var(--primary-edge); }
  .cast { fill: var(--primary-edge); opacity: .22; }
  .print { fill: var(--print); }
  .photo { fill: var(--chart-4); }
  .env { fill: var(--card); }
  .flap { fill: var(--muted); }
  .seal { fill: var(--seal); }
  .fly { fill: var(--glow); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 72px; line-height: .95; letter-spacing: -0.015em; color: var(--foreground); }
  .tag { margin: var(--space-3) 0 0 2px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ground-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      five paper ridges across the full 480 box, back to front: muted · border · wood · primary · primary-edge (the bottom half of the cover), the glow disc and print moon, one card cloud
  arrangement the home hero's pop-up diorama seen square-on: ridges rising from the bottom-left corner and stacked from y 104 to 268, each cast upward by its own silhouette in primary-edge at 22%
  pattern     literal motif row: cut-paper hills, because the system is a pop-up paper album; a print (print + chart-4) and a sealed envelope (card, muted flap, seal) stand between the ridges, six glow fireflies in front
  scales      ridge steps of space-6 (24px) between layers, cast offset 3px, fireflies r 2.2, seal r 6
-->
<circle class="glow" cx="384" cy="62" r="62"></circle>
<circle class="glow" cx="384" cy="62" r="42"></circle>
<circle class="moon" cx="384" cy="62" r="26"></circle>
<path class="cloud" d="M118 96 C 108 96 106 84 116 82 C 114 70 132 66 140 76 C 146 60 172 60 176 76 C 186 68 204 72 202 84 C 214 84 220 96 212 96 Z"></path>

<path class="cast" transform="translate(0 -3)" d="M0 288 C 30 230 70 150 130 138 C 190 126 220 160 270 140 C 320 120 350 100 400 104 C 440 108 460 120 480 116 L480 288 Z"></path>
<path class="far" d="M0 288 C 30 230 70 150 130 138 C 190 126 220 160 270 140 C 320 120 350 100 400 104 C 440 108 460 120 480 116 L480 288 Z"></path>
<path class="cast" transform="translate(0 -3)" d="M20 288 C 50 240 90 190 150 182 C 210 174 240 200 290 182 C 340 164 380 150 430 160 C 455 165 470 170 480 168 L480 288 Z"></path>
<path class="mid" d="M20 288 C 50 240 90 190 150 182 C 210 174 240 200 290 182 C 340 164 380 150 430 160 C 455 165 470 170 480 168 L480 288 Z"></path>

<g transform="rotate(-6 222 189)"><rect class="print" x="196" y="154" width="52" height="68"></rect><rect class="photo" x="201" y="159" width="42" height="46"></rect></g>
<g transform="rotate(5 395 190)"><rect class="env" x="360" y="168" width="70" height="46" rx="2"></rect><polygon class="flap" points="360,168 430,168 395,194"></polygon><circle class="seal" cx="395" cy="192" r="6"></circle></g>

<path class="cast" transform="translate(0 -3)" d="M50 288 C 80 250 120 220 180 214 C 240 208 270 232 320 216 C 370 200 410 196 450 206 C 465 210 475 212 480 212 L480 288 Z"></path>
<path class="wood" d="M50 288 C 80 250 120 220 180 214 C 240 208 270 232 320 216 C 370 200 410 196 450 206 C 465 210 475 212 480 212 L480 288 Z"></path>
<path class="cast" transform="translate(0 -3)" d="M90 288 C 120 262 160 246 220 244 C 280 242 320 258 370 246 C 410 236 450 238 480 242 L480 288 Z"></path>
<path class="deep" d="M90 288 C 120 262 160 246 220 244 C 280 242 320 258 370 246 C 410 236 450 238 480 242 L480 288 Z"></path>
<path class="edge" d="M140 288 C 180 274 230 268 290 270 C 350 272 410 264 480 268 L480 288 Z"></path>

<circle class="fly" cx="150" cy="250" r="2.2"></circle>
<circle class="fly" cx="236" cy="236" r="2.2"></circle>
<circle class="fly" cx="300" cy="262" r="2.2"></circle>
<circle class="fly" cx="340" cy="228" r="2.2"></circle>
<circle class="fly" cx="420" cy="254" r="2.2"></circle>
<circle class="fly" cx="452" cy="222" r="2.2"></circle>
</svg>
</div>
<div class="words">
<h1 class="name">Paper Album<br>UI</h1>
<p class="tag">Layered paper for photography portfolios, built on shadcn/ui.</p>
</div>
</div>
</body>
</html>
